  #     - elasticsearch

  # Futuro Broker de Mensageria (já estruturado)
  # rabbitmq:
  #   image: docker.io/library/rabbitmq:3.12-management-alpine
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   environment:
  #     RABBITMQ_DEFAULT_USER: guest
  #     RABBITMQ_DEFAULT_PASS: guest
  #   volumes:
  #     - rabbitdata:/var/lib/rabbitmq:Z

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile # Dockerfile focado em produção (multistage)
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=restaurante_user
      - DB_NAME=restaurante_db
      - DB_SSL=disable
      - DB_PASS=restaurante_password
      # - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # - ENV=production
    depends_on:
      - postgres
      # - rabbitmq
    logging:
      driver: "json-file" # garante o formato json padrão do docker
      options:
        max-size: "10m" # evita que o disco lote
        max-file: "3"

volumes:
  pgdata:
  pgadmin_data:
  # esdata:
  # rabbitdata:

