version: "3.8"

services:
  # Banco de Dados que você já usa
  postgres:
    image: docker.io/library/postgres:16-alpine # É bom usar o caminho completo no Podman
    environment:
      POSTGRES_USER: restaurante_user
      POSTGRES_PASSWORD: restaurante_password
      POSTGRES_DB: restaurante_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data:Z # O ':Z' configura os volumes para o SELinux, boa prática no Podman
      - ./enums.sql:/docker-entrypoint-initdb.d/enums.sql:Z
    networks:
      - restaurante_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurante_user -d restaurante_db"]
      interval: 3s
      timeout: 3s
      retries: 3

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # Seu login no pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin # Sua senha no pgAdmin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8081:80" # Acesse no navegador via localhost:8080
    volumes:
      - pgadmin_data:/var/lib/pgadmin:Z # Persiste as configurações do pgAdmin
    user: "5050:5050" # Evita erro de permissão (ID padrão do pgAdmin)
    networks:
      - restaurante_net
    depends_on:
      - postgres

  # Motor de Busca e Armazenamento de Logs
  # elasticsearch:
