version: '3.8'

services:
  # Banco de Dados que você já usa
  postgres:
    image: docker.io/library/postgres:16-alpine # É bom usar o caminho completo no Podman
    environment:
      POSTGRES_USER: restaurante_user
      POSTGRES_PASSWORD: restaurante_password
      POSTGRES_DB: restaurante_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data:Z # O ':Z' configura os volumes para o SELinux, boa prática no Podman

  # Motor de Busca e Armazenamento de Logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Desativado apenas para facilitar o dev local
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limita o uso de RAM no seu NixOS
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data:Z

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  # Futuro Broker de Mensageria (já estruturado)
  # rabbitmq:
  #   image: docker.io/library/rabbitmq:3.12-management-alpine
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   environment:
  #     RABBITMQ_DEFAULT_USER: guest
  #     RABBITMQ_DEFAULT_PASS: guest
  #   volumes:
  #     - rabbitdata:/var/lib/rabbitmq:Z
volumes:
  pgdata:
  esdata:
  rabbitdata: